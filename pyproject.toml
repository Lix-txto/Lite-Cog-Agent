[project]
name = "lite-cog-agent"
version = "0.1.0"
description = "A lightweight data analysis agent powered by ReAct and Tool Calling."
readme = "README.md"
authors = [
    { name = "LiXiantong", email = "lix_txt@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lite-cog-agent = "lite_cog_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
