[project]
name = "lite-cog-agent"
version = "0.1.0"
description = "A lightweight data analysis agent powered by ReAct and Tool Calling."
readme = "README.md"
authors = [
    { name = "LiXiantong", email = "lix_txt@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "matplotlib>=3.11.2",
    "openai>=3.49.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
lite-cog-agent = "lite_cog_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
